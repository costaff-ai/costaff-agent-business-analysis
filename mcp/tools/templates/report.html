<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>${title}</title>
<style>
${base_css}
${extra_css}
</style>
</head>
<body>

<!-- Running header source for WeasyPrint @top-center -->

<!-- 正式封面頁 -->
<div class="cover-page">

    <span class="cover-confidentiality">${confidentiality}</span>

  </div>

    <span>${issuer}</span>
    <span>${generated_at}</span>

<!-- 報告內容 -->
<div class="report-container">
  ${body_html}

</div>
