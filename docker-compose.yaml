services:
  business-analysis-agent:
    build:
      context: ./agent
    container_name: costaff-business-analysis-agent
    environment:
      - PORT=8081
      - PUBLIC_HOST=business-analysis-agent
      - MCP_BA_URL=http://mcp-business-analysis:8083/mcp
      - WORKSPACE_DIR=/app/data/coding_workspace
      - REPORTS_DIR=/app/data/reports
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BUSINESS_ANALYSIS_AGENT_MODEL=${BUSINESS_ANALYSIS_AGENT_MODEL:-gemini-2.5-flash}
      - COSTAFF_AGENT_MODEL_PROVIDER=${COSTAFF_AGENT_MODEL_PROVIDER:-gemini}
      - BUSINESS_ANALYSIS_AGENT_MCP_URLS=${BUSINESS_ANALYSIS_AGENT_MCP_URLS:-}
    ports:
      - "8081:8081"
    depends_on:
      - mcp-business-analysis
    restart: on-failure
    volumes:
      - business_analysis_data:/app/data

  mcp-business-analysis:
    build:
      context: ./mcp
    container_name: costaff-mcp-business-analysis
    environment:
      - MCP_BA_PORT=8083
      - WORKSPACE_DIR=/app/data/coding_workspace
      - REPORTS_DIR=/app/data/reports
    restart: on-failure
    volumes:
      - business_analysis_data:/app/data

volumes:
  business_analysis_data:
