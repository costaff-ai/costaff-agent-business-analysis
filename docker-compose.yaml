services:
  agent-business-analysis:
    build:
      context: ./agent
    container_name: costaff-agent-business-analysis
    environment:
      - PORT=8081
      - PUBLIC_HOST=costaff-agent-business-analysis
      - MCP_BA_URL=http://costaff-mcp-business-analysis:8083/mcp
      # Plan B workspace env vars (injected by CoStaff CLI at deploy time)
      - WORKSPACE_DIR=/app/data
      - SHARED_DIR=/app/data/shared
      - COSTAFF_SHARED_DIR_BUSINESS_ANALYSIS=/app/data/shared/costaff-agent-business-analysis
      - AGENT_WORKSPACE_DIR_BUSINESS_ANALYSIS=/app/data
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BUSINESS_ANALYSIS_AGENT_MODEL=${BUSINESS_ANALYSIS_AGENT_MODEL:-gemini-2.5-flash}
      - COSTAFF_AGENT_MODEL_PROVIDER=${COSTAFF_AGENT_MODEL_PROVIDER:-gemini}
      - BUSINESS_ANALYSIS_AGENT_MCP_URLS=${BUSINESS_ANALYSIS_AGENT_MCP_URLS:-}
    ports:
      - "8081:8081"
    depends_on:
      - costaff-mcp-business-analysis
    restart: on-failure
    # Note: actual bind mounts are injected by the CoStaff CLI in compose-fragment.yaml

  costaff-mcp-business-analysis:
    build:
      context: ./mcp
    container_name: costaff-mcp-business-analysis
    environment:
      - MCP_BA_PORT=8083
      - WORKSPACE_DIR=/app/data
      - SHARED_DIR=/app/data/shared
      - COSTAFF_SHARED_DIR_BUSINESS_ANALYSIS=/app/data/shared/costaff-agent-business-analysis
      - AGENT_WORKSPACE_DIR_BUSINESS_ANALYSIS=/app/data
    restart: on-failure
    # Note: actual bind mounts are injected by the CoStaff CLI in compose-fragment.yaml
